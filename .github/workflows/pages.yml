name: Data and deploy

# Every deploy rebuilds the data, so a code-only deploy never publishes the site without it.
on:
  schedule:
    # GFS cycles 00/06/12/18 UTC. The job needs f168 (7 days). Measured on the AWS mirror
    # (16 cycles, 27-30 Oct 2026): f168 lands 4 h 16 m to 4 h 33 m after the cycle. Run at
    # cycle + 4 h 47 m; the job also picks the newest cycle whose f168 exists, so an early or
    # late run never mixes cycles (docs/data-pipeline.md).
    - cron: '47 4,10,16,22 * * *'
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Site checks (no keys, pinned SRI-verified CDN files, local links, JSON, no hourly data committed)
        run: python3 scripts/check_site.py --verify-sri
      - name: Syntax-check JavaScript modules and data scripts
        run: |
          for f in site/js/*.js scripts/data/*.mjs; do cp "$f" "$RUNNER_TEMP/check.mjs" && node --check "$RUNNER_TEMP/check.mjs" || exit 1; done
          python3 -m py_compile scripts/*.py scripts/data/*.py
      - name: Unit tests (display-unit conversions, great-circle distance)
        run: node scripts/data/unit-tests.mjs
      - name: Sources probe (events and street-photo hosts, CORS headers, terms text)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: node scripts/data/sources-probe.mjs sources-probe.md && cat sources-probe.md >> "$GITHUB_STEP_SUMMARY"

  data:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore wgrib2 build
        id: wgrib2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .wgrib2
          key: wgrib2-v3.8.0-986287cc-${{ runner.os }}-${{ runner.arch }}
      - name: Build wgrib2 v3.8.0 (pinned)
        if: steps.wgrib2.outputs.cache-hit != 'true'
        run: scripts/data/build_wgrib2.sh .wgrib2
      - name: Save wgrib2 build
        if: steps.wgrib2.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .wgrib2
          key: wgrib2-v3.8.0-986287cc-${{ runner.os }}-${{ runner.arch }}
      # Air quality is reused while < 11 h old, from this cache or the deployed site, to stay
      # inside Open-Meteo's free budget (3,870 locations per refresh, about 2 refreshes a day).
      - name: Restore air-quality cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .aq-cache
          key: aq-rg16-v2-${{ github.run_id }}
          restore-keys: aq-rg16-v2-
      - name: Build data (GFS via NOMADS, AWS fallback; CAMS via Open-Meteo)
        env:
          WGRIB2: .wgrib2/bin/wgrib2
        run: |
          python3 scripts/data/build_data.py --out site/data/live --previous "$PAGES_URL/data/live" \
            --aq-cache .aq-cache --report run-report.json
      # Street photos: the page reads its public Mapillary client token from js/secrets.js. The
      # build writes it empty (layer shows "unavailable"); only the deploy job (main) fills it in
      # from the MAPILLARY_CLIENT_TOKEN secret. Never committed (.gitignore; check_site.py scans).
      - name: Street photos token placeholder (empty in builds)
        run: printf "export const MAPILLARY_TOKEN = '';\n" > site/js/secrets.js
      - name: Save air-quality cache
        if: hashFiles('.aq-cache/aq.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .aq-cache
          key: aq-rg16-v2-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: |
            site
            run-report.json
          retention-days: 2

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: data
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow-level block, so contents: read must be
    # repeated here or checkout of a private repo fails with "Repository not found".
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
      - name: Street photos token (public Mapillary client token from the MAPILLARY_CLIENT_TOKEN secret)
        env:
          MLY: ${{ secrets.MAPILLARY_CLIENT_TOKEN }}
        run: |
          t=$(printf %s "$MLY" | tr -d '[:space:]')
          # shape only, never the value: helps tell a wrong paste from a missing secret
          echo "Mapillary secret: ${#t} chars, starts with MLY|: $([[ "$t" == MLY\|* ]] && echo yes || echo no), parts: $(awk -F'|' '{print NF}' <<<"$t"), only letters/digits/_-|: $([[ "$t" =~ ^[A-Za-z0-9_|-]*$ ]] && echo yes || echo no)"
          [[ "$t" =~ ^MLY\|[0-9]+\|[A-Za-z0-9_-]+$ ]] || t=""
          printf "export const MAPILLARY_TOKEN = '%s';\n" "$t" > site/js/secrets.js
          echo "Mapillary token configured: $([ -n "$t" ] && echo yes || echo 'no (Street photos will show unavailable)')"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  archive:
    # One small summary per day (after the 18Z cycle). Hourly files are never committed.
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: built
      - name: Commit daily summary
        run: |
          f=$(python3 scripts/data/archive_day.py built/site/data/live/manifest.json data/archive)
          [ -z "$f" ] && { echo "Not the 18Z cycle; nothing to archive."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$f"
          git commit -m "Data archive: $(basename "$f" .json)" && git push

  # Pull requests: screenshot the site with the freshly built real data, check its values
  # against independent references and run the rendering tests. The work is split into jobs
  # that run side by side (render tests in 4 parts, screenshots + accuracy + perf + probes);
  # a last job commits the small text reports to docs/screenshots/<branch>/. Images and probe
  # output go to the ci-screenshots artifact (30 days).
  verify-tests:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: built
      # Optional CI-only token so PR tests can show photos; without it they show the
      # "unavailable" state. Written into the downloaded build only, never committed.
      - name: Street photos token for the PR tests (optional MAPILLARY_CI_TOKEN secret)
        env:
          MLY: ${{ secrets.MAPILLARY_CI_TOKEN }}
        run: |
          t=$(printf %s "$MLY" | tr -d '[:space:]')
          # shape only, never the value: helps tell a wrong paste from a missing secret
          echo "Mapillary secret: ${#t} chars, starts with MLY|: $([[ "$t" == MLY\|* ]] && echo yes || echo no), parts: $(awk -F'|' '{print NF}' <<<"$t"), only letters/digits/_-|: $([[ "$t" =~ ^[A-Za-z0-9_|-]*$ ]] && echo yes || echo no)"
          [[ "$t" =~ ^MLY\|[0-9]+\|[A-Za-z0-9_-]+$ ]] || t=""
          printf "export const MAPILLARY_TOKEN = '%s';\n" "$t" > built/site/js/secrets.js
          echo "MLY_CI=$([ -n "$t" ] && echo 1 || echo 0)" >> "$GITHUB_ENV"
      # A stalled download once hung this step for 30+ minutes: bounded, with retries.
      - name: Install Playwright 1.63.0 + Chromium
        timeout-minutes: 12
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          for i in 1 2 3; do timeout 180 npx playwright install --with-deps chromium && exit 0; echo "::warning::Playwright install attempt $i stalled or failed; retrying"; done; exit 1
      - name: Rendering and behaviour tests, part ${{ matrix.part }} of 4
        continue-on-error: true
        env:
          RT_PART: ${{ matrix.part }}
        run: |
          (cd built/site && python3 -m http.server 8123 --bind 127.0.0.1 &) ; sleep 2
          mkdir -p ci-out && node scripts/data/render-tests.mjs http://127.0.0.1:8123/ "ci-out/render-tests-${{ matrix.part }}.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: render-tests-${{ matrix.part }}
          path: ci-out
          retention-days: 2

  verify-shots:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RAW: ci-out
      LABEL: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: built
      - name: Street photos token for the PR screenshots (optional MAPILLARY_CI_TOKEN secret)
        env:
          MLY: ${{ secrets.MAPILLARY_CI_TOKEN }}
        run: |
          t=$(printf %s "$MLY" | tr -d '[:space:]')
          # shape only, never the value: helps tell a wrong paste from a missing secret
          echo "Mapillary secret: ${#t} chars, starts with MLY|: $([[ "$t" == MLY\|* ]] && echo yes || echo no), parts: $(awk -F'|' '{print NF}' <<<"$t"), only letters/digits/_-|: $([[ "$t" =~ ^[A-Za-z0-9_|-]*$ ]] && echo yes || echo no)"
          [[ "$t" =~ ^MLY\|[0-9]+\|[A-Za-z0-9_-]+$ ]] || t=""
          printf "export const MAPILLARY_TOKEN = '%s';\n" "$t" > built/site/js/secrets.js
          echo "MLY_CI=$([ -n "$t" ] && echo 1 || echo 0)" >> "$GITHUB_ENV"
          echo "CI Mapillary token configured: $([ -n "$t" ] && echo yes || echo no)"
      # A stalled download once hung this step for 30+ minutes: bounded, with retries.
      - name: Install Playwright 1.63.0 + Chromium
        timeout-minutes: 12
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          for i in 1 2 3; do timeout 180 npx playwright install --with-deps chromium && exit 0; echo "::warning::Playwright install attempt $i stalled or failed; retrying"; done; exit 1
      - name: Screenshots
        run: |
          (cd built/site && python3 -m http.server 8123 --bind 127.0.0.1 &) ; sleep 2
          node scripts/data/screenshots.mjs http://127.0.0.1:8123/ "$RAW"
          cp built/run-report.json "$RAW/run-report.json"
          python3 - <<'EOF'
          import json, os
          for v in json.load(open(os.environ["RAW"] + "/views.json")):
              print(f"::notice title=View {v['view']}::legend={v['legend']} | probe={v['probe']} | stale={v['stale']} | sample labels visible={v['sampleLabelsVisible']} | errors={len(v['errors'])}")
          EOF
      - name: Accuracy check (page values vs Open-Meteo GFS / CAMS and NWS)
        continue-on-error: true
        run: node scripts/data/accuracy.mjs http://127.0.0.1:8123/ built/run-report.json "$RAW/accuracy.md" "$LABEL"
      - name: Performance before/after (main vs this branch, same data, same machine)
        continue-on-error: true
        run: |
          git fetch --depth=1 origin main && git worktree add base FETCH_HEAD
          cp -r built/site/data/live base/site/data/live
          (cd base/site && python3 -m http.server 8124 --bind 127.0.0.1 &) ; sleep 2
          node scripts/data/perf.mjs "$RAW/perf.md" "main=http://127.0.0.1:8124/" "${LABEL}=http://127.0.0.1:8123/" "${LABEL} + isobars + rain=http://127.0.0.1:8123/|pres,rain"
      - name: Bandwidth per frame and per 7-day play (0, 1 and 2 overlays)
        continue-on-error: true
        run: node scripts/data/bandwidth.mjs built/site/data/live "$RAW/bandwidth.md" > /dev/null
      - name: Sources probe (events and street-photo hosts; report committed with the others)
        continue-on-error: true
        run: node scripts/data/sources-probe.mjs "$RAW/sources-probe.md" > /dev/null
      # The satellite probe (Phase 2 diagnostics) takes ~45 minutes: run it only when the
      # satellite code or the probe itself differs from main.
      - name: Satellite imagery probe (only when satellite code changed)
        continue-on-error: true
        run: |
          if git diff --quiet FETCH_HEAD HEAD -- site/js/basemaps.js site/js/config.js scripts/data/satellite-probe.mjs; then
            echo "Satellite code unchanged from main: probe skipped."
          else
            node scripts/data/satellite-probe.mjs "$RAW/probe"
          fi
      - name: Upload screenshots and probe output (artifact, 30 days)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-screenshots
          path: ci-out
          retention-days: 30

  verify:
    # Collects the text reports of the jobs above and commits them (no images).
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.data.result == 'success' }}
    needs: [data, verify-tests, verify-shots]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RAW: ci-out
      OUT: docs/screenshots/${{ github.head_ref }}
      LABEL: ${{ github.head_ref }}
      MAX_JSON_BYTES: 204800
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-screenshots
          path: ci-out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: render-tests-*
          path: ci-out
          merge-multiple: true
      - name: Commit the text reports to the PR branch (no images)
        run: |
          mkdir -p "$OUT"
          # one render-tests.md from the 4 parts
          { for p in 1 2 3 4; do [ -f "$RAW/render-tests-$p.md" ] && { echo "<!-- part $p of 4 -->"; cat "$RAW/render-tests-$p.md"; echo; }; done; } > "$RAW/render-tests.md"
          for f in accuracy.md render-tests.md perf.md sources-probe.md bandwidth.md; do [ -s "$RAW/$f" ] && cp "$RAW/$f" "$OUT/$f"; done
          sizes=""
          for f in views.json run-report.json; do
            [ -f "$RAW/$f" ] || continue
            n=$(stat -c %s "$RAW/$f"); sizes="$sizes $f $((n / 1024)) KB;"
            if [ "$n" -le "$MAX_JSON_BYTES" ]; then cp "$RAW/$f" "$OUT/$f"
            else
              git rm -q --ignore-unmatch "${OUT:?}/${f:?}"
              echo "::notice title=Artifact only::$f is $((n / 1024)) KB (over $((MAX_JSON_BYTES / 1024)) KB)"
            fi
          done
          {
            echo "# CI output for this branch"
            echo
            echo "Screenshots, probe output and any report over $((MAX_JSON_BYTES / 1024)) KB are in the workflow artifact"
            echo "**ci-screenshots** of run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (kept 30 days)."
            echo "Sizes this run:$sizes"
          } > "$OUT/ci-artifact.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          git commit -m "CI: accuracy table, render tests and small reports ($LABEL) [skip ci]" || exit 0
          git push
